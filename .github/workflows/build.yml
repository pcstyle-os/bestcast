name: Build

# Every push and PR on this fork: the definition of done from docs/testing.md, then an optimised
# dev-channel app packaged under the commit it was built from, so the tested commit and the
# downloadable build are one artifact.
on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: "dev builds Bestcast Dev.app; stable builds Bestcast.app, still unpublished"
        type: choice
        options: [dev, stable]
        default: dev

concurrency:
  group: build-${{ github.ref }}-${{ inputs.channel || 'dev' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner. Installed Xcodes:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install SwiftLint
        run: brew install swiftlint

      # ext-test's menu timing cases fail now and then on a loaded runner, so a failed harness gets
      # one solo rerun; passing only on the rerun is reported as flaky, never hidden.
      - name: Harnesses
        run: |
          set -o pipefail
          if ./Scripts/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/tests.log"; then exit 0; fi
          FAILED="$(sed -n 's/.*harness(es) failed in [0-9]*s: //p' "$RUNNER_TEMP/tests.log" \
            | sed 's/\x1b\[[0-9;]*m//g')"
          [ -n "$FAILED" ] || exit 1
          for NAME in $FAILED; do
            BESTCAST_TEST_JOBS=1 ./Scripts/run-tests.sh "$NAME" || exit 1
            echo "::warning::$NAME failed in the parallel run and passed alone: flaky"
          done

      - name: Lint
        run: ./Scripts/lint.sh

      - name: Pure-layer purity
        run: |
          if grep -rln 'import AppKit\|import SwiftUI\|import Cocoa' Bestcast/Features/*/Model/; then
            echo "::error::AppKit or SwiftUI imported under Features/*/Model/"
            exit 1
          fi

      - name: Debug build
        run: |
          set -o pipefail
          xcodebuild build -project Bestcast.xcodeproj -scheme Bestcast -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DebugData" CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee "$RUNNER_TEMP/debug.log" | grep -E 'warning:|error:|BUILD' || true
          grep -q 'BUILD SUCCEEDED' "$RUNNER_TEMP/debug.log"
          WARNINGS="$({ grep -E '^/.*: warning:' "$RUNNER_TEMP/debug.log" || true; } | sort -u | wc -l | tr -d ' ')"
          echo "Debug build: $WARNINGS unique warnings" >> "$GITHUB_STEP_SUMMARY"

      # Release-optimised; the dev channel's name and bundle id let it run beside an installed Bestcast
      # without sharing its prefs, data, TCC grants or login item. Stable is never published here.
      - name: Release build (${{ inputs.channel || 'dev' }} channel)
        id: release
        env:
          CHANNEL: ${{ inputs.channel || 'dev' }}
        run: |
          set -o pipefail
          case "$CHANNEL" in
            dev)    NAME="Bestcast Dev"; BUNDLE=com.bestcast.app.dev ;;
            stable) NAME="Bestcast";     BUNDLE=com.bestcast.app ;;
          esac
          xcodebuild build -project Bestcast.xcodeproj -scheme Bestcast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/ReleaseData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            PRODUCT_NAME="$NAME" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 \
            | tee "$RUNNER_TEMP/release.log" | grep -E 'error:|BUILD' || true
          grep -q 'BUILD SUCCEEDED' "$RUNNER_TEMP/release.log"
          echo "app=$RUNNER_TEMP/ReleaseData/Build/Products/Release/$NAME.app" >> "$GITHUB_OUTPUT"

      # The same shape checks release.yml runs, so a stable artifact is what a release would ship.
      - name: Assert the stable build is releasable
        if: inputs.channel == 'stable'
        env:
          APP: ${{ steps.release.outputs.app }}
        run: |
          for BIN in "$APP/Contents/MacOS/Bestcast" "$APP/Contents/Helpers/ClipboardTextHelper"; do
            SLICES="$(lipo -archs "$BIN")"
            if [ "$SLICES" != "arm64" ]; then
              echo "::error::${BIN##*/}: expected arm64 alone, got '$SLICES'"
              exit 1
            fi
          done
          ./Scripts/verify-signature.sh "$APP"

      - name: Package
        id: package
        env:
          APP: ${{ steps.release.outputs.app }}
          CHANNEL: ${{ inputs.channel || 'dev' }}
        run: |
          codesign --verify --deep --strict "$APP"
          SHORT="${GITHUB_SHA::7}"
          if [ "$CHANNEL" = stable ]; then
            VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "$APP/Contents/Info.plist")"
            ZIP="Bestcast-${VERSION}-${SHORT}"
          else
            ZIP="Bestcast-Dev-${SHORT}"
          fi
          mkdir -p dist
          printf 'commit %s\nref %s\nrun %s\nchannel %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" \
            "$GITHUB_RUN_ID" "$CHANNEL" > dist/BUILD_INFO.txt
          ditto -c -k --keepParent --sequesterRsrc "$APP" "dist/${ZIP}.zip"
          du -h "dist/${ZIP}.zip" >> "$GITHUB_STEP_SUMMARY"
          echo "name=$ZIP" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/
          retention-days: 90
